# Builds the Windows screensaver (Hajsaver.scr) and the WebAssembly page.
# On the default branch it also:
#   - publishes the page to the gh-pages branch (GitHub Pages serves it; no Pages settings needed beyond
#     "Deploy from a branch: gh-pages", which GitHub picks automatically for a new gh-pages branch)
#   - updates the "latest" GitHub Release with Hajsaver.scr attached
# Pushing a tag like v1.0.0 makes a versioned release too. Other branches and pull requests just build, and
# upload Hajsaver.scr as a workflow artifact.
name: Build

on:
  push:
    branches: ['**', '!gh-pages']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu
      - name: MinGW cross compiler (for the .scr)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (same version as in Cargo.lock)
        run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      - name: Build the page and the screensaver
        run: ./tools/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hajsaver.scr
          path: web/Hajsaver.scr

      - name: Publish the page (gh-pages branch)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Release "latest"
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest && git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Hajsaver (latest build)" --notes "Built from ${GITHUB_SHA}. Download Hajsaver.scr, right-click it and choose Install."
          gh release edit latest --notes "Built from ${GITHUB_SHA}. Download Hajsaver.scr, right-click it and choose Install." --prerelease=false
          gh release upload latest web/Hajsaver.scr --clobber

      - name: Release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Hajsaver $GITHUB_REF_NAME" --notes "Download Hajsaver.scr, right-click it and choose Install."
          gh release upload "$GITHUB_REF_NAME" web/Hajsaver.scr --clobber
