# Builds the Windows screensaver (Hajsaver.scr) and the WebAssembly page.
# On main:
#   - deploys the page to GitHub Pages (Settings -> Pages -> Source: GitHub Actions)
#   - updates the "latest" GitHub Release with Hajsaver.scr attached
# A tag like v1.0.0 makes a versioned release too. Other branches and pull requests only build, and upload
# Hajsaver.scr as a workflow artifact.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu
      - name: MinGW cross compiler (for the .scr)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (same version as in Cargo.lock)
        run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      - name: Build the page and the screensaver
        run: ./tools/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hajsaver.scr
          path: web/Hajsaver.scr
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # one release update at a time
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hajsaver.scr
      - name: Publish Hajsaver.scr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Built from ${GITHUB_SHA}. Download Hajsaver.scr, right-click it and choose Install."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; title="Hajsaver $GITHUB_REF_NAME"
          else tag=latest; title="Hajsaver (latest build)"
            # point the latest tag at this commit through the API (no git push, so nothing to race)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null; fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$title" --notes "$notes"
          gh release edit "$tag" --notes "$notes"
          gh release upload "$tag" Hajsaver.scr --clobber
