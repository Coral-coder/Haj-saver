[package]
name = "hajsaver"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Blahaj swimming through the Abyssal Garden: a native Windows screensaver and a WebGPU page"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hajsaver"
path = "src/main.rs"

[dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_Security"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "HtmlElement", "CssStyleDeclaration", "Performance", "console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"

[profile.dev]
opt-level = 2

[build-dependencies]
embed-resource = "3"
